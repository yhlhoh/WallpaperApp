<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wallpaper Upload</title>
    <link rel="stylesheet" href="/assets/common.css" />
    <script defer src="/assets/upload.js"></script>
  </head>
  <body>
    <main class="shell">
      <h1>Upload Wallpaper / Dynamic Video</h1>
      <div class="grid">
        <section class="card">
          <h2>Upload</h2>
          <form id="uploadForm">
            <label for="file">Media File (image/video)</label>
            <input id="file" type="file" accept="image/*,video/*" required />

            <label for="duration">Display Seconds</label>
            <input id="duration" type="number" min="3" max="1800" value="20" required />

            <div class="row" style="margin-top:14px">
              <button type="submit">Upload to S3</button>
              <button class="secondary" id="refreshQuota" type="button">Refresh Quota</button>
            </div>
          </form>
          <p class="notice" id="quotaInfo"></p>
          <p class="notice" id="uploadResult"></p>
        </section>

        <section class="card">
          <h2>Playback URL</h2>
          <p>Open this URL on any screen to auto-play active media with crossfade:</p>
          <p><a id="playUrl" href="/play" target="_blank" rel="noopener"></a></p>
          <p class="notice">Videos are played muted automatically. Old unpinned media is auto-deleted by retention policy.</p>
        </section>
      </div>
    </main>
  </body>
</html>
