<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="upload.pageTitle">Wallpaper Upload</title>
    <link rel="stylesheet" href="/assets/common.css" />
    <script defer src="/assets/i18n.js"></script>
    <script defer src="/assets/upload.js"></script>
  </head>
  <body>
    <main class="shell">
      <div class="row" style="justify-content:flex-end;margin-bottom:12px;">
        <label for="langSelect" data-i18n="common.language" style="margin:0;">Language</label>
        <select id="langSelect" style="width:140px;">
          <option value="en" data-i18n="common.english">English</option>
          <option value="zh-CN" data-i18n="common.chineseSimplified">简体中文</option>
        </select>
      </div>
      <h1 data-i18n="upload.heading">Upload Wallpaper / Dynamic Video</h1>
      <div class="grid">
        <section class="card">
          <h2 data-i18n="upload.sectionTitle">Upload</h2>
          <form id="uploadForm">
            <label for="file" data-i18n="upload.mediaFileLabel">Media File (image/video)</label>
            <input id="file" type="file" accept="image/*,video/*" required />

            <label for="duration" data-i18n="upload.durationLabel">Display Seconds</label>
            <input id="duration" type="number" min="3" max="1800" value="20" required />

            <div class="row" style="margin-top:14px">
              <button type="submit" data-i18n="upload.uploadBtn">Upload to S3</button>
              <button class="secondary" id="refreshQuota" type="button" data-i18n="upload.refreshQuotaBtn">Refresh Quota</button>
            </div>
          </form>
          <p class="notice" id="quotaInfo"></p>
          <p class="notice" id="uploadResult"></p>
        </section>

        <section class="card">
          <h2 data-i18n="upload.playbackTitle">Playback URL</h2>
          <p data-i18n="upload.playbackTip">Open this URL on any screen to auto-play active media with crossfade:</p>
          <p><a id="playUrl" href="/play" target="_blank" rel="noopener"></a></p>
          <p class="notice" data-i18n="upload.playbackNote">Videos are played muted automatically. Old unpinned media is auto-deleted by retention policy.</p>
        </section>
      </div>
    </main>
  </body>
</html>
