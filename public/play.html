<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="play.pageTitle">Wallpaper Playback</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; }
      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 900ms ease;
        background: #000;
      }
      .slide.active { opacity: 1; }
      .slide img, .slide video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .slide.image img { display: block; }
      .slide.video video { display: block; }
      #empty {
        position: absolute;
        inset: 0;
        color: #cdd8e6;
        font: 500 18px/1.4 system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #02060c;
      }
    </style>
    <script defer src="/assets/i18n.js"></script>
    <script defer src="/assets/play.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="a" class="slide"><img alt="" /><video muted playsinline preload="auto"></video></div>
      <div id="b" class="slide"><img alt="" /><video muted playsinline preload="auto"></video></div>
      <div id="empty" data-i18n="play.empty">No media available yet.</div>
    </div>
  </body>
</html>
